services:
  mailpit:
    container_name: hypertube_mailpit
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hypertube-network

  db:
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"

  redis:
    ports:
      - "${EXPOSED_REDIS_PORT}:${REDIS_PORT}"

  s3:
    ports:
      - "9000:9000"
      - "9001:9001"

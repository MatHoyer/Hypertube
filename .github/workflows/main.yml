name: prod-build

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  pre-build-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install jq

      - name: Check translation completeness
        run: |
          ./scripts/check_translation.sh

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hypertube
        run: pnpm build:packages

      - name: Run server tests
        run: pnpm --filter server test

  docker-startup:
    runs-on: ubuntu-latest
    needs: [pre-build-tests, server-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install curl

      - name: Create .env file
        run: cp .env.ci .env

      - name: Create Docker network
        run: docker network create hypertube-network || echo "Network already exists"

      - name: Start VPN stub container
        run: docker compose -f docker-compose-vpn-ci.yml up -d

      - name: Start DB containers (docker-compose.yml)
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for DBs to be ready
        run: |
          echo "Waiting for hypertube_db to be healthy..."

          docker logs -f hypertube_db &
          LOGS_PID=$!

          for i in {1..15}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' hypertube_db 2>/dev/null || echo "not found")
            if [ "$status" == "healthy" ]; then
              echo "✅ Database is healthy!"
              kill $LOGS_PID
              exit 0
            fi
            sleep 2
          done
          echo "❌ Database did not become healthy in time"
          kill $LOGS_PID
          exit 1

      - name: Start App containers (docker-compose-prod.yml)
        run: docker compose -f docker-compose-prod.yml up -d

      - name: Wait for Client to be ready
        run: |
          echo "Waiting for client to be healthy..."

          docker logs -f hypertube-client-prod &
          LOGS_PID=$!

          for i in {1..60}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' hypertube-client-prod 2>/dev/null || echo "not found")
            if [ "$status" == "healthy" ]; then
              echo "✅ Client is healthy!"
              kill $LOGS_PID
              exit 0
            fi
            sleep 2
          done
          echo "❌ Client did not become healthy in time"
          kill $LOGS_PID
          exit 1

      - name: Wait for Server to be ready
        run: |
          echo "Waiting for server to be healthy..."

          docker logs -f hypertube-server-prod &
          LOGS_PID=$!

          for i in {1..60}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' hypertube-server-prod 2>/dev/null || echo "not found")
            if [ "$status" == "healthy" ]; then
              echo "✅ Server is healthy!"
              kill $LOGS_PID
              exit 0
            fi
            sleep 2
          done
          echo "❌ Server did not become healthy in time"
          kill $LOGS_PID
          exit 1

      - name: Check all containers status
        run: |
          containers="hypertube-client-prod hypertube-server-prod hypertube-downloader-prod hypertube-scheduler-prod"
          max_attempts=2
          wait_time=10

          for container in $containers; do
            echo "⏳ Waiting for $container to be ready..."
            attempts=0
            
            while [ $attempts -lt $max_attempts ]; do
              status=$(docker inspect --format='{{.State.Status}}' $container 2>/dev/null || echo "not found")
              
              if [ "$status" = "running" ]; then
                echo "✅ $container is running"
                break
              elif [ $attempts -eq $((max_attempts - 1)) ]; then
                echo "❌ $container failed to start after $((max_attempts * wait_time)) seconds"
                exit 1
              else
                echo "⏳ $container status: $status (attempt $((attempts + 1))/$max_attempts)"
                sleep $wait_time
                attempts=$((attempts + 1))
              fi
            done
          done

          echo "🎉 All required containers are running and ready!"

      - name: Shutdown all containers
        if: always()
        run: |
          docker compose -f docker-compose-prod.yml down
          docker compose -f docker-compose.yml down
          docker compose -f docker-compose-vpn-ci.yml down

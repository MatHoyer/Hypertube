name: prod-build

on:
  push:
  workflow_dispatch:

jobs:
  pre-build-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install jq

      - name: Check translation completeness
        run: |
          ./check_translation.sh

  docker-startup:
    runs-on: ubuntu-latest
    needs: pre-build-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install curl

      - name: Create .env file
        run: |
          cat <<EOF > .env
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}

          SERVER_URL=${{ secrets.SERVER_URL }}
          SERVER_PORT=${{ secrets.SERVER_PORT }}
          CLIENT_URL=${{ secrets.CLIENT_URL }}
          CLIENT_PORT=${{ secrets.CLIENT_PORT }}

          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_API_EMAIL_FROM=${{ secrets.RESEND_API_EMAIL_FROM }}
          RESEND_API_EMAIL_TO=${{ secrets.RESEND_API_EMAIL_TO }}

          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID=${{ secrets.O_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.O_GITHUB_CLIENT_SECRET }}
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}
          SCHOOL_42_CLIENT_ID=${{ secrets.SCHOOL_42_CLIENT_ID }}
          SCHOOL_42_CLIENT_SECRET=${{ secrets.SCHOOL_42_CLIENT_SECRET }}

          TRANSMISSION_HOST=${{ secrets.TRANSMISSION_HOST }}
          TRANSMISSION_RCP_PORT=${{ secrets.TRANSMISSION_RCP_PORT }}
          TRANSMISSION_TORRENT_PORT=${{ secrets.TRANSMISSION_TORRENT_PORT }}

          TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}

          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}

          INTERNAL_TOKEN=${{ secrets.INTERNAL_TOKEN }}
          EOF

      - name: Create Docker network
        run: docker network create hypertube-network || echo "Network already exists"

      - name: Start DB containers (docker-compose.yml)
        run: docker compose up -d

      - name: Wait for DBs to be ready
        run: |
          echo "Waiting for hypertube_db to be healthy..."

          docker logs -f ${{ secrets.POSTGRES_HOST }} &
          LOGS_PID=$!

          for i in {1..15}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' ${{ secrets.POSTGRES_HOST }} 2>/dev/null || echo "not found")
            if [ "$status" == "healthy" ]; then
              echo "✅ Database is healthy!"
              kill $LOGS_PID
              exit 0
            fi
            sleep 2
          done
          echo "❌ Database did not become healthy in time"
          kill $LOGS_PID
          exit 1

      - name: Start App containers (docker-compose-prod.yml)
        run: docker compose -f docker-compose-prod.yml up -d

      - name: Wait for App to be ready
        run: |
          echo "Waiting for app to be healthy..."

          docker logs -f hypertube-prod &
          LOGS_PID=$!

          for i in {1..60}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' hypertube-prod 2>/dev/null || echo "not found")
            if [ "$status" == "healthy" ]; then
              echo "✅ App is healthy!"
              kill $LOGS_PID
              exit 0
            fi
            sleep 2
          done
          echo "❌ App did not become healthy in time"
          kill $LOGS_PID
          exit 1

      - name: Shutdown all containers
        if: always()
        run: |
          docker compose -f docker-compose-prod.yml down
          docker compose down

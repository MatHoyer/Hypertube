services:
  app:
    container_name: hypertube-prod
    build:
      context: .
      dockerfile: ./Dockerfile.prod
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      - NODE_ENV=PROD
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - REDIS_HOST=redis
    ports:
      - ${SERVER_PORT}
    volumes:
      - movies_data:/hypertube/apps/server/downloads
    command: bash -c "pnpm lint && pnpm --filter server-core prisma:migrate && pnpm build:app && pnpm start:app"
    networks:
      - hypertube-network
    healthcheck:
      test: ["CMD", "curl", "-f", "${SERVER_URL}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  downloader:
    container_name: hypertube-downloader-prod
    build:
      context: .
      dockerfile: ./apps/downloader/Dockerfile.prod
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      - REDIS_HOST=redis
      - NODE_ENV=PROD
      - TRANSMISSION_HOST=transmission
    command: bash -c "pnpm lint && pnpm --filter server-core prisma:generate && pnpm build:downloader && pnpm start:downloader"
    volumes:
      - movies_data:/hypertube/apps/downloader/downloads
    networks:
      - hypertube-network
    depends_on:
      - app

  scheduler:
    container_name: hypertube-scheduler-prod
    build:
      context: .
      dockerfile: ./apps/scheduler/Dockerfile.prod
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      - REDIS_HOST=redis
      - NODE_ENV=PROD
    command: bash -c "pnpm lint && pnpm --filter server-core prisma:generate && pnpm build:scheduler && pnpm start:scheduler"
    networks:
      - hypertube-network
    depends_on:
      - app

networks:
  hypertube-network:
    external: true

volumes:
  movies_data:

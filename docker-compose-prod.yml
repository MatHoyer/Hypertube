services:
  migrate:
    build:
      context: .
      dockerfile: ./packages/server-core/Dockerfile.migration
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    restart: "no"
    networks:
      - hypertube-network

  app:
    container_name: hypertube-prod
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile.prod
    env_file: .env
    environment:
      - PUID=1000
      - PGID=1000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - NODE_ENV=PROD
      - YTS_PROXY_URL=http://vpn:${YTS_PROXY_PORT}
      - REDIS_HOST=redis
      - CLIENT_URL=${SERVER_URL}
      - CLIENT_PORT=${SERVER_PORT}
    volumes:
      - movies_data:/hypertube/apps/server/downloads
    networks:
      - hypertube-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  downloader:
    container_name: hypertube-downloader-prod
    build:
      context: .
      dockerfile: ./apps/downloader/Dockerfile.prod
    env_file: .env
    environment:
      - PUID=1000
      - PGID=1000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
      - NODE_ENV=PROD
      - TRANSMISSION_HOST=vpn
    volumes:
      - movies_data:/hypertube/apps/downloader/downloads
      - movies_data_transmission:/hypertube/apps/downloader/downloads-transmission
    networks:
      - hypertube-network
    depends_on:
      - app

  scheduler:
    container_name: hypertube-scheduler-prod
    build:
      context: .
      dockerfile: ./apps/scheduler/Dockerfile.prod
    env_file: .env
    environment:
      - PUID=1000
      - PGID=1000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_HOST=redis
      - NODE_ENV=PROD
    networks:
      - hypertube-network
    depends_on:
      - app

  yts-api-proxy:
    container_name: hypertube-yts-api-proxy-prod
    build:
      context: .
      dockerfile: ./apps/yts-api-proxy/Dockerfile.prod
    env_file: .env
    environment:
      - PUID=1000
      - PGID=1000
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - REDIS_HOST=redis
      - NODE_ENV=PROD
    volumes:
      - movies_data:/hypertube/apps/yts-api-proxy/downloads
    network_mode: container:vpn

networks:
  hypertube-network:
    external: true

volumes:
  movies_data:
  movies_data_transmission:
